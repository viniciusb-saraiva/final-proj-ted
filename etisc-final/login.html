<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETISC - Login de Empresa</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script defer src="./frontend/login.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="index.html"><strong>ETISC</strong></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Início</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="candidato.html">Ver Vagas</a>
            </li>
            <li class="nav-item d-none d-lg-block">
              <span class="nav-link text-white-50">|</span>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="login.html"
                >Login Empresa</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="cadastro.html"
              >
                Cadastrar Empresa
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
              <h1 class="h3 mb-0">Login de Empresa</h1>
            </div>
            <div class="card-body">
              <form action="/login" method="post">
                <fieldset>
                  <legend class="h5 border-bottom pb-2 mb-3">
                    Insira suas Credenciais
                  </legend>

                  <div class="mb-3">
                    <label for="cnpj" class="form-label">CNPJ:</label>
                    <input
                      type="text"
                      id="cnpj"
                      name="cnpj"
                      class="form-control"
                      maxlength="18"
                      placeholder="11.222.333/4444-55"
                      autocomplete="off"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label for="password" class="form-label">Senha:</label>
                    <input
                      type="password"
                      id="password"
                      name="senha"
                      class="form-control"
                      placeholder="Digite sua senha"
                      autocomplete="current-password"
                      required
                      minlength="6"
                    />
                  </div>
                </fieldset>

                <button type="submit" class="btn btn-primary w-100 mt-3">
                  Entrar
                </button>
              </form>
            </div>
            <div class="card-footer text-center">
              <p class="mb-0">
                Não tem cadastro?
                <a href="./cadastro.html">Cadastre sua empresa</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
