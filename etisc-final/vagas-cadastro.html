<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETISC - Painel de Vagas da Empresa</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script defer src="./frontend/vagas-cadastro.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <header class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
      <div class="container">
        <h1 class="navbar-brand mb-0 h2">Painel de Vagas</h1>
        <div class="d-flex align-items-center">
          <p id="empresa-info" class="text-white mb-0 me-3"></p>
          <button id="logout-btn" class="btn btn-danger btn-sm">Sair</button>
        </div>
      </div>
    </header>

    <main class="container my-5">
      <section id="painel-empresa" class="mb-5">
        <div class="card shadow">
          <div class="card-header bg-light">
            <h2 class="h4 mb-0">Gerenciamento de Vagas</h2>
          </div>
          <div class="card-body">
            <form id="form-vaga">
              <input type="hidden" id="vaga-id" value="" />
              <fieldset>
                <legend class="h5 border-bottom pb-2 mb-3">
                  Detalhes da Vaga
                </legend>

                <div class="mb-3">
                  <label for="titulo" class="form-label">Título da Vaga:</label>
                  <input
                    type="text"
                    id="titulo"
                    class="form-control"
                    placeholder="Desenvolvedor Frontend (Estágio)"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="localizacao" class="form-label"
                    >Localização:</label
                  >
                  <input
                    type="text"
                    id="localizacao"
                    class="form-control"
                    placeholder="Itajaí, SC"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="remuneracao" class="form-label"
                    >Remuneração:</label
                  >
                  <input
                    type="text"
                    id="remuneracao"
                    class="form-control"
                    placeholder="R$2000.00"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="requisitos" class="form-label"
                    >Requisitos (separados por vírgula):</label
                  >
                  <input
                    type="text"
                    id="requisitos"
                    class="form-control"
                    placeholder="HTML, CSS, JS, React"
                    required
                  />

                </div>
                  <div class="mb-3">
                  <label for="site-empresa" class="form-label"
                    >Site da empresa para contato (URL):</label
                  >
                  <input
                    type="text"
                    id="site-empresa"
                    class="form-control"
                    placeholder="https://www.microsoft.com/pt-br"
                    required
                  />
                </div>
              </fieldset>

              <button
                type="submit"
                id="submit-btn"
                class="btn btn-success mt-3 w-100"
              >
                Adicionar Vaga
              </button>
            </form>
          </div>
        </div>

        <h3 class="mt-5 mb-3">Minhas Vagas Cadastradas</h3>
        <ul id="minhas-vagas-lista" class="list-group shadow-sm"></ul>
        <a href="./candidato.html" class="btn btn-outline-secondary mt-3"
          >Ver todas as vagas (Interface do Candidato)</a
        >
      </section>
    </main>

    <footer class="bg-light text-center py-3 mt-5">
      <p class="mb-0"><small>&copy; 2025 ETISC</small></p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
