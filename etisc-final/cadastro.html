<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETISC - Cadastro de empresa</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script defer src="./frontend/cadastro.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="index.html"><strong>ETISC</strong></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Início</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="candidato.html">Ver Vagas</a>
            </li>
            <li class="nav-item d-none d-lg-block">
              <span class="nav-link text-white-50">|</span>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="login.html">Login Empresa</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                aria-current="page"
                href="cadastro.html"
              >
                Cadastrar Empresa
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
              <h1 class="h3 mb-0">Cadastro de Empresa</h1>
            </div>
            <div class="card-body">
              <form action="/cadastrar" method="post">
                <fieldset>
                  <legend class="h5 border-bottom pb-2 mb-3">
                    Dados da Empresa
                  </legend>

                  <div class="mb-3">
                    <label for="nome" class="form-label"
                      >Nome da Empresa:</label
                    >
                    <input
                      type="text"
                      name="nome"
                      id="nome"
                      class="form-control"
                      placeholder="Digite o nome da empresa aqui..."
                      required
                      aria-required="true"
                    />
                  </div>

                  <div class="mb-3">
                    <label for="cnpj" class="form-label">CNPJ:</label>
                    <input
                      maxlength="18"
                      type="text"
                      name="cnpj"
                      id="cnpj"
                      class="form-control"
                      placeholder="11.222.333/4444-55"
                      autocomplete="off"
                      required
                      aria-required="true"
                      pattern="\d{2}\.\d{3}\.\d{3}/\d{4}-\d{2}"
                      title="Digite um CNPJ no formato 11.222.333/4444-55"
                    />
                  </div>

                  <div class="mb-3">
                    <label for="password" class="form-label">Senha:</label>
                    <input
                      type="password"
                      name="senha"
                      id="password"
                      class="form-control"
                      placeholder="Digite a senha aqui..."
                      autocomplete="new-password"
                      required
                      aria-required="true"
                      minlength="6"
                      title="A senha deve ter pelo menos 6 caracteres"
                    />
                  </div>
                </fieldset>
                <button
                  type="submit"
                  class="btn btn-primary w-100 mt-3"
                  aria-label="Cadastrar Empresa"
                >
                  Cadastrar
                </button>
              </form>
            </div>
            <div class="card-footer text-center">
              <p class="mb-0">
                <a href="./login.html">Já tem uma conta? Faça Login</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
